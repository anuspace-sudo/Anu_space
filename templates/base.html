<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anu’s Space - A little space for myself</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- LEFT SIDEBAR (~255px) -->
  <aside class="sidebar">
    <div class="sidebar-top">
      
      <!-- Logo / Brand -->
      <a href="{{ url_for('home') }}" class="brand-logo">
        <div class="brand-icon-wrapper">
          <!-- Elegant Leaf Branch SVG -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#5E4E78" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
            <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
          </svg>
        </div>
        <span class="brand-title">Anu’s Space</span>
      </a>

      <!-- Navigation Menu -->
      <nav>
        <ul class="nav-list">
          <li>
            <a href="{{ url_for('home') }}" class="nav-link {% if page == 'home' %}active{% endif %}">
              <!-- Home Icon -->
              <svg viewBox="0 0 24 24">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <span>Home</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('diary_list') }}" class="nav-link {% if page == 'diary' %}active{% endif %}">
              <!-- Book / Diary Icon -->
              <svg viewBox="0 0 24 24">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
              </svg>
              <span>Diary</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('focus_page') }}" class="nav-link {% if page == 'coding' %}active{% endif %}">
              <!-- Code Icon -->
              <svg viewBox="0 0 24 24">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
              </svg>
              <span>Coding</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('reminders_page') }}" class="nav-link {% if page == 'reminders' %}active{% endif %}">
              <!-- Clock / Reminder Icon -->
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"></circle>
                <polyline points="12 6 12 12 16 14"></polyline>
              </svg>
              <span>Reminders</span>
            </a>
          </li>
          <li>
            <a href="{{ url_for('settings_page') }}" class="nav-link {% if page == 'settings' %}active{% endif %}">
              <!-- Settings Icon -->
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
              </svg>
              <span>Settings</span>
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Sidebar Bottom Quote -->
    <div class="sidebar-footer">
      <p class="sidebar-quote">A calmer mind<br>builds a brighter you.</p>
      <div class="sidebar-quote-line"></div>
    </div>
  </aside>

  <!-- MAIN CONTENT AREA -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
