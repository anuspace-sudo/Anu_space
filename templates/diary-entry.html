{% extends "base.html" %}

{% block content %}
<div class="subpage-container" style="max-width: 800px; margin: 0 auto;">
  
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
    <h2 class="subpage-title">
      {% if entry %}Edit Diary Entry{% else %}New Diary Entry{% endif %}
    </h2>
    <a href="{{ url_for('diary_list') }}" style="font-size: 14px; color: #6D549E; text-decoration: none; font-weight: 600;">&larr; Back to Diary</a>
  </div>

  <form method="POST" action="{% if entry %}{{ url_for('diary_edit', entry_id=entry.id) }}{% else %}{{ url_for('diary_new') }}{% endif %}">
    
    <div class="form-group">
      <label class="form-label" for="title">Title</label>
      <input type="text" id="title" name="title" class="form-input" placeholder="Give your entry a title..." value="{{ entry.title if entry else '' }}" required autofocus>
    </div>

    <div class="form-group">
      <label class="form-label" for="entry_date">Date</label>
      <input type="date" id="entry_date" name="entry_date" class="form-input" value="{{ entry.entry_date if entry else today_str }}" required>
    </div>

    <div class="form-group">
      <label class="form-label" for="content">Thoughts & Reflections</label>
      <textarea id="content" name="content" class="form-textarea" placeholder="Write it down. Leave it here..." required>{{ entry.content if entry else '' }}</textarea>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 24px;">
      <button type="submit" class="form-btn btn-primary">
        {% if entry %}Save Changes{% else %}Save Entry{% endif %}
      </button>
      <a href="{{ url_for('diary_list') }}" class="form-btn" style="background: #ECE7DF; color: #555; text-decoration: none;">Cancel</a>
    </div>

  </form>

</div>
{% endblock %}
